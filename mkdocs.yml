site_name: Mengran Zhao
site_url: https://MrZ-Condmat.github.io/
repo_url: https://github.com/MrZ-Condmat
repo_name: MrZ-Condmat

nav:
  - Home: index.md
  - Projects: projects.md

theme:
  name: material
  favicon: assets/avatar-favicon.png
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/typewriter.js
